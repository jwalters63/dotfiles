windowrule {
    name = panel_diagnostico
    match:class = ^(popup-fetch)$
    float = true
    size = 700 200
    
    # OPCIÓN A: Libre movimiento, pero nace anclado abajo a la izquierda
    move = 20 100%-470
    
    # OPCIÓN B: Si prefieres que nazca en el centro, borra el 'move' y usa esto:
    # center = true
    
}

layerrule {
    name = rofi-slide-anim
    match:namespace = ^rofi$
    animation = slide left
}

layerrule {
    name = blur-waybar
    match:namespace = ^waybar$
    blur = on
    ignore_alpha = 0.2
}

layerrule {
    name = swaync_control_blur
    match:namespace = ^swaync-control-center$
    animation = slide right
}

layerrule {
    name = nwg_dock_rules
    match:namespace = ^nwg-dock$
    blur = on
    ignore_alpha = 0.1
    animation = slide bottom
}

layerrule {
    name = swaync_center
    match:namespace = ^swaync-control-center$
    blur = on
    ignore_alpha = 0.5
}

layerrule {
    name = swaync_notif
    match:namespace = ^swaync-notification-window$
    blur = on
    ignore_alpha = 0.1
}

layerrule {
    name = control_center_blur
    match:namespace = ^gtk4-layer-shell$
    blur = on
    ignore_alpha = 0.12
    animation = slide left
}
