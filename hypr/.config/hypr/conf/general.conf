# See https://wiki.hyprland.org/Configuring/Variables/ for more
general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    col.active_border = rgb(7e2553) rgb(ff004d) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
    resize_on_border = true
}

env = XDG_DATA_DIRS,/usr/share:/usr/local/share:~/.local/share:/var/lib/flatpak/exports/share:~/.local/share/flatpak/exports/share
env = MESA_SHADER_CACHE_MAX_SIZE,10G

render {
	direct_scanout = true
}

